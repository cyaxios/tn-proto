name: release-python

# Python-only tags never trigger npm or extension publishing.
on:
  push:
    tags: ['python-v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Build only or publish verified wheels to PyPI'
        type: choice
        default: none
        options: [none, pypi]

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_RETRY: '10'

jobs:
  build-wheels:
    name: Build and verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Check version and tag
        id: version
        shell: python
        run: |
          import os, re, tomllib
          with open('python/pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          assert re.fullmatch(r'\d{4}\.\d{1,2}\.\d{1,2}(?:b\d+)?', version), version
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'python-v' + version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
      - name: Build locked Rust and PyO3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Check metadata and installed lifecycle
        shell: python
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          import os, pathlib, subprocess, sys, venv
          wheels = list(pathlib.Path('python/dist').resolve().glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'twine'], check=True)
          subprocess.run([sys.executable, '-m', 'twine', 'check', '--strict', str(wheels[0])], check=True)
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'governed-wheel-check'
          venv.create(root, with_pip=True)
          python = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          subprocess.run([str(python), '-m', 'pip', 'install', str(wheels[0])], check=True)
          script = pathlib.Path('scripts/verify_governed_wheel.py').resolve()
          subprocess.run([str(python), str(script), os.environ['RELEASE_VERSION']], cwd=root, check=True)
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  publish:
    needs: build-wheels
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Require both platform wheels
        shell: python
        run: |
          from pathlib import Path
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 2, wheels
          assert any('manylinux' in p.name and 'x86_64' in p.name for p in wheels)
          assert any('win_amd64' in p.name for p in wheels)
      - name: Publish verified wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
